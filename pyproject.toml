[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
version = "0.1.0"
description = "A small, extensible Python tool-using agent"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-workflow = "agent_workflow.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_workflow*"]
