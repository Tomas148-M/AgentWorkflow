[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "agent-workflow"
version = "0.1.0"
description = "A small, extensible Python tool-using agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai-coder = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.0,<4"]

[project.scripts]
agent-workflow = "agent_workflow.__main__:main"
ai-coder = "agent_workflow.AI_coder.cli:main"

[tool.poetry]
packages = [{ include = "agent_workflow" }]
